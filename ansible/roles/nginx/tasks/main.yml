- name: Install nginx
  ansible.builtin.dnf:
    name: nginx
    state: present
- name: Publish page
  ansible.builtin.copy:
    src: index.html
    dest: /usr/share/nginx/html/index.html
    owner: root
    group: root
    mode: '0644'
- name: Publish health endpoint
  ansible.builtin.copy:
    content: |
      healthy
    dest: /usr/share/nginx/html/health.html
    owner: root
    group: root
    mode: '0644'
- name: Enable nginx
  ansible.builtin.service:
    name: nginx
    state: started
    enabled: true
